name: CI

on:
  push:
    branches: [master, "feature/*"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🐍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test-unit:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests -v --ignore=tests/e2e --ignore=tests/integration
        env:
          ALLOWED_USER_ID: "123456789"
          POSTGRES_URL: "postgresql+asyncpg://user:pass@localhost:5432/teeshka"
          REDIS_URL: "redis://localhost:6379/0"
          GEMINI_GATEWAY_URL: "http://localhost:8080"
          TELEGRAM_BOT_TOKEN: "test_bot_token"
          LLM_API_KEY: "test_llm_key"
          GOOGLE_APPLICATION_CREDENTIALS_JSON: "e30="
          LANGFUSE_PUBLIC_KEY: "pk-lf-test"
          LANGFUSE_SECRET_KEY: "sk-lf-test"
          S3_ACCESS_KEY: "test_access"
          S3_SECRET_KEY: "test_secret"

  test-e2e:
    name: "🤖 E2E Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Run E2E tests
        env:
          # Required secrets for E2E tests
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_E2E_API_KEY: ${{ secrets.LLM_E2E_API_KEY }}
          LANGFUSE_E2E_PUBLIC_KEY: ${{ secrets.LANGFUSE_E2E_PUBLIC_KEY }}
          LANGFUSE_E2E_SECRET_KEY: ${{ secrets.LANGFUSE_E2E_SECRET_KEY }}
          S3_E2E_ENDPOINT: ${{ secrets.S3_E2E_ENDPOINT }}
          S3_E2E_ACCESS_KEY: ${{ secrets.S3_E2E_ACCESS_KEY }}
          S3_E2E_SECRET_KEY: ${{ secrets.S3_E2E_SECRET_KEY }}
          S3_E2E_BUCKET: ${{ secrets.S3_E2E_BUCKET }}
        run: uv run pytest tests/e2e -v -m e2e --tb=short
